<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="/pixelator/favicon_io/favicon-32x32.png">
  <meta property="og:title" content="Big Pixelator">
  <meta property="og:description" content="House.">
  <meta property="og:image" content="/pixelator/face.png">
  <meta property="og:url" content="https://clownfish-app-w3bmr.ondigitalocean.app/pixelator/">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Big Pixelator</h1>
      <p class="subtitle">Transform your images with pixelation and color effects</p>
    </header>

    <div class="main-content">
      <aside class="sidebar">
        <div class="control-section">
          <h3>Upload Image</h3>
          <label for="imageUpload" class="file-upload-label">
            <span>Choose Image</span>
            <input type="file" id="imageUpload" accept="image/*">
          </label>
        </div>

        <div class="control-section">
          <h3>Settings</h3>
          <div class="control-group">
            <label for="pixelationRange">
              <span>Pixelation</span>
              <output id="pixelationValue">10</output>
            </label>
            <input type="range" id="pixelationRange" min="0" max="100" value="10">
          </div>
          <div class="control-group">
            <label for="saturationRange">
              <span>Saturation</span>
              <output id="saturationValue">0.50</output>
            </label>
            <input type="range" id="saturationRange" min="0" max="1" step="0.01" value="0.5">
          </div>
          <div class="control-group">
            <label for="brightnessRange">
              <span>Brightness</span>
              <output id="brightnessValue">128</output>
            </label>
            <input type="range" id="brightnessRange" min="0" max="255" value="128">
          </div>
          <div class="control-group">
            <label for="contrastRange">
              <span>Contrast</span>
              <output id="contrastValue">1.00</output>
            </label>
            <input type="range" id="contrastRange" min="0.5" max="2" step="0.01" value="1">
          </div>
          <div class="control-group">
            <label for="seedInput">
              <span>Seed</span>
            </label>
            <div class="seed-input-group">
              <input type="number" id="seedInput" value="0">
              <button id="randomizeSeedBtn" class="btn btn-icon" title="Randomize Seed">🎲</button>
            </div>
          </div>
          <div class="control-group checkbox-group">
            <label for="useFixedSeed">
              <input type="checkbox" id="useFixedSeed">
              <span>Use Fixed Seed</span>
            </label>
          </div>
        </div>

        <div class="control-section">
          <h3>Effects</h3>
          <div class="action-buttons">
            <button id="applyBtn" class="btn btn-secondary">Apply</button>
            <button id="exponentializeBtn" class="btn btn-secondary">Exponentialize</button>
            <button id="shiftBtn" class="btn btn-secondary">Shift</button>
          </div>
          <div class="control-group">
            <label for="shiftSpeedSlider">
              <span>Shift Speed</span>
              <output id="shiftSpeedValue">4200</output>
            </label>
            <input type="range" id="shiftSpeedSlider" min="200" max="5000" value="4200">
          </div>
        </div>

        <div class="control-section">
          <button id="downloadBtn" class="btn btn-download">Download Image</button>
        </div>
      </aside>

      <main class="canvas-area">
        <div id="canvasContainer">
          <canvas id="canvas"></canvas>
          <div class="empty-state">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <p>Upload an image to get started</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
